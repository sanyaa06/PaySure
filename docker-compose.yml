
services:
  db:
    image: postgres:16-alpine
    container_name: paysure-postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paysure_db}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-paysure_db}
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - paysure-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: paysure-backend
    restart: on-failure

    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paysure_db}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: "false"

      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - paysure-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: paysure-frontend
    restart: on-failure

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - paysure-net

volumes:
  postgres_data:
    driver: local

networks:
  paysure-net:
    driver: bridge
