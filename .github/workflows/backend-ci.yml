name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-tests:
    name: Backend, lint, migrations, and security validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paysure_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy bandit[toml] pip-audit

      - name: Measure backend coverage
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paysure_test_db
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-report=xml backend/tests

      - name: Lint and format validation with Ruff
        run: |
          ruff check backend/app backend/tests

      - name: Type checking with mypy
        run: |
          mypy --ignore-missing-imports backend/app

      - name: Security scan
        run: |
          bandit -r backend/app -x backend/tests -q
          pip-audit --requirement backend/requirements.txt

      - name: Run Database Migrations with Alembic
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paysure_test_db
        run: |
          cd backend
          alembic upgrade head

      - name: Execute pytest suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paysure_test_db
        run: |
          pytest backend/tests -v --durations=10

  frontend-validation:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
